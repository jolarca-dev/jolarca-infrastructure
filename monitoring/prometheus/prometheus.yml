# Prometheus configuration — Jolarca marketplace monitoring.
# Scrapes all services over the WireGuard mesh (10.10.0.0/16).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Alert rules
rule_files:
  - "/etc/prometheus/rules/*.yml"

# Alertmanager
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["10.10.1.6:9093"]

# Scrape targets
scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Node exporter — all hosts (OS-level metrics)
  - job_name: "node_exporter"
    static_configs:
      - targets:
          - "10.10.1.1:9100"  # edge
          - "10.10.1.2:9100"  # app
          - "10.10.1.3:9100"  # db
          - "10.10.1.4:9100"  # vault
          - "10.10.1.5:9100"  # minio
          - "10.10.1.6:9100"  # monitor
          - "10.10.1.7:9100"  # backup
    metrics_path: /metrics

  # nginx — edge proxy metrics (via nginx-prometheus-exporter)
  - job_name: "nginx"
    static_configs:
      - targets: ["10.10.1.1:9113"]
    metrics_path: /metrics

  # PostgreSQL — DB metrics (via postgres_exporter)
  - job_name: "postgresql"
    static_configs:
      - targets: ["10.10.1.3:9187"]
    metrics_path: /metrics

  # Django backend — application metrics (via django-prometheus)
  - job_name: "django_backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["10.10.1.2:8000"]

  # Vault — metrics (built-in, requires token)
  - job_name: "vault"
    bearer_token_file: /etc/prometheus/vault-metrics-token
    static_configs:
      - targets: ["10.10.1.4:8200"]
    metrics_path: /v1/sys/metrics

  # MinIO — metrics (built-in)
  - job_name: "minio"
    bearer_token_file: /etc/prometheus/minio-metrics-token
    static_configs:
      - targets: ["10.10.1.5:9000"]
    metrics_path: /minio/v2/metrics/cluster

  # WireGuard — mesh health (via wg-prometheus-exporter)
  - job_name: "wireguard"
    static_configs:
      - targets:
          - "10.10.1.1:9586"
          - "10.10.1.2:9586"
          - "10.10.1.3:9586"
          - "10.10.1.4:9586"
          - "10.10.1.5:9586"
          - "10.10.1.6:9586"
          - "10.10.1.7:9586"
    metrics_path: /metrics

  # BorgBackup — backup status (via textfile collector)
  - job_name: "backup_status"
    static_configs:
      - targets: ["10.10.1.7:9100"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "backup_.*"
        action: keep
