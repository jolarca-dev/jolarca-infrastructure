# Dependabot — supply-chain hygiene for dependency ecosystems present in
# this repo. SOC 2 CC7.1: vulnerabilities in tooling are monitored.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "terraform"
    directory: "/terraform/environments/production"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "terraform"
    directory: "/terraform/environments/staging"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(deps)"

  # Ansible Galaxy collections join here when the ansible workstream lands
  # (package-ecosystem: "ansible").
