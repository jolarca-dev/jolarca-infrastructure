# codeql.yml — inherited baseline: static analysis over pipeline definitions.
# This repo has no application code; CodeQL analyzes the GitHub Actions
# workflows themselves (workflow injection is a real infra supply-chain risk).
name: codeql
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "31 4 * * 1"   # weekly Monday scan
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: actions

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
