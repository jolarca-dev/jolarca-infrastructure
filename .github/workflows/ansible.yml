# ansible.yml — ansible-lint -> syntax-check -> molecule test.
# Activates automatically when ansible content lands in ansible/.
name: ansible
on:
  pull_request:
    paths: ["ansible/**", ".github/workflows/ansible.yml"]
  push:
    branches: [main]
    paths: ["ansible/**"]
permissions:
  contents: read
jobs:
  lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ansible tooling
        run: |
          pipx install ansible-lint
          pipx install "ansible>=9,<11"

      - name: Install pinned collections
        working-directory: ansible
        run: ansible-galaxy collection install -r requirements.yml

      - name: ansible-lint
        working-directory: ansible
        run: ansible-lint

  syntax:
    name: Syntax check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ansible
        run: pipx install "ansible>=9,<11"

      - name: Install pinned collections
        working-directory: ansible
        run: ansible-galaxy collection install -r requirements.yml

      - name: Syntax check all playbooks
        working-directory: ansible
        run: |
          for p in playbooks/*.yml; do
            echo "Checking $p..."
            ansible-playbook --syntax-check -i inventories/staging/hosts.yml "$p"
          done

  molecule:
    name: Molecule tests
    runs-on: ubuntu-latest
    needs: syntax
    strategy:
      fail-fast: false
      matrix:
        role:
          - hardening
          - wireguard
          - postgresql
          - vault
          - minio
          - nginx
          - backup
          - redis
          - monitoring
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ansible + molecule
        run: |
          pipx install "ansible>=9,<11"
          pipx install "molecule[docker]"

      - name: Install pinned collections
        working-directory: ansible
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run Molecule test for ${{ matrix.role }}
        working-directory: ansible
        run: molecule test -s default
        env:
          ROLE_NAME: ${{ matrix.role }}
