# ansible.yml — ansible-lint -> syntax-check -> molecule.
# The bare-metal workstream is PENDING: every step is guarded so this
# workflow passes green until ansible content lands, then activates itself.
name: ansible
on:
  pull_request:
    paths: ["ansible/**", ".github/workflows/ansible.yml"]
  push:
    branches: [main]
    paths: ["ansible/**"]
permissions:
  contents: read
jobs:
  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Workstream gate
        id: gate
        run: |
          if ls ansible/playbooks/*.yml >/dev/null 2>&1; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "ansible workstream pending — nothing to lint yet"
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install ansible tooling
        if: steps.gate.outputs.active == 'true'
        run: pipx install ansible-lint && pipx install "ansible>=9,<11"

      - name: Install pinned collections
        if: steps.gate.outputs.active == 'true'
        working-directory: ansible
        run: ansible-galaxy collection install -r requirements.yml

      - name: ansible-lint
        if: steps.gate.outputs.active == 'true'
        working-directory: ansible
        run: ansible-lint

      - name: Syntax check (all playbooks)
        if: steps.gate.outputs.active == 'true'
        working-directory: ansible
        run: for p in playbooks/*.yml; do ansible-playbook --syntax-check -i inventories/staging/hosts.yml "$p"; done

      - name: Molecule tests
        if: steps.gate.outputs.active == 'true'
        working-directory: ansible
        run: pipx install molecule && molecule test --all
