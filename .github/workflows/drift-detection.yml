# drift-detection.yml — scheduled reconciliation of declared IaC vs reality.
# Unexplained drift is a security signal (possible out-of-band change);
# it opens an issue and is tracked as change-management evidence (CC8.1).
#
# State source: once TF_REMOTE_STATE=true flips (post ADR-0003 migration),
# the drift plan reads REMOTE GCS state via Workload Identity Federation —
# no SA JSON keys, impersonating the environment state SA. Until then it
# keeps the legacy -backend=false dry behavior. Setup:
# docs/workload-identity-federation.md
name: drift-detection
on:
  schedule:
    - cron: "23 5 * * *"   # daily
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/terraform-setup

      - name: Authenticate to GCP (Workload Identity Federation)
        if: vars.TF_REMOTE_STATE == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_STATE_SA_PRODUCTION }}

      - name: Drift check (production)
        id: drift
        continue-on-error: true
        working-directory: terraform/environments/production
        env:
          GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN_READONLY }}
        run: |
          if [ "${{ vars.TF_REMOTE_STATE }}" = "true" ]; then
            # Remote state (ADR-0003): real drift detection via WIF.
            terraform init -input=false \
              -backend-config=../../backends/production.backend.hcl \
              -backend-config="impersonate_service_account=${{ vars.GCP_STATE_SA_PRODUCTION }}"
          else
            terraform init -backend=false
          fi
          set +e
          # exit 0 = no drift, 2 = drift present, 1 = error
          terraform plan -lock=false -detailed-exitcode
          rc=$?
          set -e
          echo "exitcode=$rc" >> "$GITHUB_OUTPUT"

      - name: Open drift issue
        if: steps.drift.outputs.exitcode == '2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "DRIFT detected in production ($(date -u +%F))" \
            --label "drift,change-request" \
            --body "terraform plan --detailed-exitcode reported out-of-band changes in production.
          Triage per CONTRIBUTING.md: explain with a change record or treat as incident (SECURITY.md).
          Run: \`scripts/check-drift.sh production\` locally for details."

      - name: Fail on drift or error
        if: steps.drift.outputs.exitcode != '0'
        run: |
          echo "drift/error detected (exit ${{ steps.drift.outputs.exitcode }})"
          exit 1
