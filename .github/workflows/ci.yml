# ci.yml — inherited baseline gate: lint + validate everything committed.
# Job name MUST stay "ci": branch protection requires the "ci" status check.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: YAML lint
        run: |
          YAMLLINT_CFG="{extends: default, rules: {line-length: {max: 140},"
          YAMLLINT_CFG="$YAMLLINT_CFG comments: {min-spaces-from-content: 1},"
          YAMLLINT_CFG="$YAMLLINT_CFG truthy: disable, document-start: disable,"
          YAMLLINT_CFG="$YAMLLINT_CFG comments-indentation: disable}}"
          yamllint -d "$YAMLLINT_CFG" \
            .github/ backup/ monitoring/ .pre-commit-config.yaml qodana.yaml

      - name: Shellcheck operator scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck scripts/*.sh

      - name: Secret-pattern audit
        run: bash scripts/audit-no-secrets.sh

      - name: Terraform validate (all environments)
        uses: ./.github/actions/terraform-setup

      - name: Validate production root module
        working-directory: terraform/environments/production
        run: terraform init -backend=false && terraform validate

      - name: Validate staging root module
        working-directory: terraform/environments/staging
        run: terraform init -backend=false && terraform validate
