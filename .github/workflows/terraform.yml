# terraform.yml — fmt -> validate -> tflint -> checkov -> plan (PR)
# and gated apply (main, manual dispatch, environment approval).
#
# Credential model: TF_GITHUB_TOKEN is a PAT stored as a REPO secret —
# repo-scoped custody by design (smaller blast radius than org secrets;
# these tokens are only consumed by this repo's workflows).
# Custody: security/key-custody.md, rotated per runbook. Plan uses a
# READ-scoped token; apply uses a separate WRITE-scoped token available
# only to the "production" environment. NOTE: required-reviewer approval
# gates need GitHub Team+ for private org repos; until then the gate is
# repo write access + environment secret separation (tracked gap).
name: terraform
on:
  pull_request:
    paths: ["terraform/**", ".github/workflows/terraform.yml", ".github/actions/terraform-setup/**"]
  push:
    branches: [main]
    paths: ["terraform/**"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to apply"
        type: choice
        options: [staging, production]
        required: true
permissions:
  contents: read
env:
  TF_IN_AUTOMATION: "true"
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [staging, production]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/terraform-setup
      - name: tflint
        uses: terraform-linters/setup-tflint@v6
      # Fail on errors only: warnings (e.g. scaffold variables reserved for
      # pending workstreams) are visible in the log but do not block merge.
      - run: tflint --init && tflint --minimum-failure-severity=error
        working-directory: terraform/environments/${{ matrix.env }}
      - name: Validate
        working-directory: terraform/environments/${{ matrix.env }}
        run: terraform init -backend=false && terraform validate
      - name: Validate bootstrap root (ADR-0003)
        if: matrix.env == 'production'
        working-directory: terraform/bootstrap
        run: |
          terraform init -backend=false
          # The workspace guard refuses 'default' by design (ADR-0002
          # isolation); validate under a real environment workspace.
          terraform workspace new staging
          terraform validate
      - name: Checkov
        run: pipx run checkov -d terraform/environments/${{ matrix.env }} --quiet
      - name: Checkov (bootstrap + state-bucket module)
        if: matrix.env == 'production'
        run: |
          pipx run checkov -d terraform/bootstrap --quiet
          pipx run checkov -d terraform/modules/state-bucket --quiet

  plan:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: staging-readonly
    # Job-scoped least privilege: write only what the plan-summary comment
    # needs (403'd on PR #5 while riding workflow-level contents:read).
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/terraform-setup
      - name: Plan (production root, read-only token)
        working-directory: terraform/environments/production
        env:
          GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN_READONLY }}
        run: |
          terraform init -backend=false
          terraform plan -lock=false -no-color -out=tfplan
          terraform show -no-color tfplan > plan.txt
      - name: Attach plan summary to PR
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/environments/production/plan.txt', 'utf8');
            const summary = plan.split('\n').filter(l => /Plan:|No changes/.test(l)).join('\n') || 'see artifacts';
            github.rest.issues.createComment({
              issue_number: context.issue.number, owner: context.repo.owner, repo: context.repo.repo,
              body: `**Terraform plan (production)**\n\n\`\`\`\n${summary}\n\`\`\`\nFull plan in workflow artifacts.`
            });
      - uses: actions/upload-artifact@v7
        with:
          name: tf-plan-production
          path: terraform/environments/production/plan.txt

  apply:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    # Manual approval gate on the GitHub environment; production additionally
    # requires the two-person rule (reviewers configured per environment).
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/terraform-setup
      - name: Select environment state SA
        id: sa
        run: |
          case "${{ inputs.environment }}" in
            staging)    echo "email=${{ vars.GCP_STATE_SA_STAGING }}" >> "$GITHUB_OUTPUT" ;;
            production) echo "email=${{ vars.GCP_STATE_SA_PRODUCTION }}" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Authenticate to GCP (Workload Identity Federation)
        if: vars.TF_REMOTE_STATE == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ steps.sa.outputs.email }}
      - name: Apply
        working-directory: terraform/environments/${{ inputs.environment }}
        env:
          GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN_WRITE }}
        run: |
          if [ "${{ vars.TF_REMOTE_STATE }}" = "true" ]; then
            # Remote state (ADR-0003): WIF auth, impersonate the state SA —
            # no SA JSON keys in CI (docs/workload-identity-federation.md).
            terraform init -input=false \
              -backend-config=../../backends/${{ inputs.environment }}.backend.hcl \
              -backend-config="impersonate_service_account=${{ steps.sa.outputs.email }}"
          else
            terraform init
          fi
          terraform apply -auto-approve -input=false
