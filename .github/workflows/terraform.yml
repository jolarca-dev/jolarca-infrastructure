# terraform.yml — fmt -> validate -> tflint -> checkov -> plan (PR)
# and gated apply (main, manual dispatch, environment approval).
#
# Credential model: TF_GITHUB_TOKEN is a fine-grained PAT stored as an org
# secret (custody: security/key-custody.md, rotated per runbook). Plan uses
# a READ-scoped token; apply uses a separate WRITE-scoped token available
# only to the "production" environment behind manual approval.
name: terraform
on:
  pull_request:
    paths: ["terraform/**", ".github/workflows/terraform.yml", ".github/actions/terraform-setup/**"]
  push:
    branches: [main]
    paths: ["terraform/**"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to apply"
        type: choice
        options: [staging, production]
        required: true
permissions:
  contents: read
env:
  TF_IN_AUTOMATION: "true"
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [staging, production]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/terraform-setup
      - name: tflint
        uses: terraform-linters/setup-tflint@v6
      - run: tflint --init && tflint
        working-directory: terraform/environments/${{ matrix.env }}
      - name: Validate
        working-directory: terraform/environments/${{ matrix.env }}
        run: terraform init -backend=false && terraform validate
      - name: Checkov
        run: pipx run checkov -d terraform/environments/${{ matrix.env }} --quiet

  plan:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: staging-readonly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/terraform-setup
      - name: Plan (production root, read-only token)
        working-directory: terraform/environments/production
        env:
          GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN_READONLY }}
        run: |
          terraform init -backend=false
          terraform plan -lock=false -no-color -out=tfplan
          terraform show -no-color tfplan > plan.txt
      - name: Attach plan summary to PR
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/environments/production/plan.txt', 'utf8');
            const summary = plan.split('\n').filter(l => /Plan:|No changes/.test(l)).join('\n') || 'see artifacts';
            github.rest.issues.createComment({
              issue_number: context.issue.number, owner: context.repo.owner, repo: context.repo.repo,
              body: `**Terraform plan (production)**\n\n\`\`\`\n${summary}\n\`\`\`\nFull plan in workflow artifacts.`
            });
      - uses: actions/upload-artifact@v7
        with:
          name: tf-plan-production
          path: terraform/environments/production/plan.txt

  apply:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    # Manual approval gate on the GitHub environment; production additionally
    # requires the two-person rule (reviewers configured per environment).
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/terraform-setup
      - name: Apply
        working-directory: terraform/environments/${{ inputs.environment }}
        env:
          GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN_WRITE }}
        run: |
          terraform init
          terraform apply -auto-approve -input=false
