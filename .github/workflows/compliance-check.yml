# compliance-check.yml — inherited baseline: license/policy presence checks.
# Private repo: the LICENSE is an internal-use notice; every governance file
# required by CONTRIBUTING.md must exist and stay non-empty.
name: compliance-check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Governance files present
        run: |
          for f in README.md LICENSE SECURITY.md CONTRIBUTING.md CHANGELOG.md \
                   .github/CODEOWNERS .github/PULL_REQUEST_TEMPLATE.md; do
            [ -s "$f" ] || { echo "MISSING/EMPTY: $f"; exit 1; }
          done

      - name: Internal-use notice intact
        run: grep -q "INTERNAL USE ONLY" LICENSE

      - name: No state/keys referenced in tracked config
        run: |
          ! grep -RInE '\.(tfstate|pem|key)\b' --include='*.tf' --include='*.hcl' --include='*.yml' terraform/ || {
            echo "state/key file reference found in IaC"; exit 1; }

      - name: ADR numbering continuous
        run: |
          ls docs/adr/[0-9]*.md 2>/dev/null | sed 's/.*\///;s/-.*//' | awk 'NR>1 && $1!=p+1 {print "gap in ADR numbering"; exit 1} {p=$1}'
