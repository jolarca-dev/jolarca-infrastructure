# security-scan.yml — Gitleaks, Checkov, tfsec, Trivy config scan, and
# OPA/Conftest policy checks against terraform/policies/.
# Job name MUST stay "security": branch protection requires the "security"
# status check (terraform/modules/github-org).
name: security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"   # nightly full-history secret scan
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0   # gitleaks needs history

      - name: Gitleaks (full history)
        run: |
          # CLI instead of gitleaks-action: the action now requires a paid
          # GITLEAKS_LICENSE; the CLI is free and version-pinnable.
          GL_VER=8.21.2
          GL_URL="https://github.com/gitleaks/gitleaks/releases/download"
          curl -fsSL "$GL_URL/v$GL_VER/gitleaks_${GL_VER}_linux_x64.tar.gz" \
            | tar xz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks detect --source . --no-banner --redact

      - name: Checkov (IaC misconfiguration)
        run: pipx run checkov -d terraform --quiet --compact

      # NOTE: tfsec was removed 2026-08: the project is archived upstream and
      # its rule set merged into Trivy (next step), which is maintained.
      # Running an abandoned scanner next to its successor is debt, not
      # defense. Revisit only if a maintained fork appears.

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          exit-code: "1"
          severity: HIGH,CRITICAL

      - name: Install Conftest
        run: |
          curl -fsSL https://github.com/open-policy-agent/conftest/releases/download/v0.55.0/conftest_0.55.0_Linux_x86_64.tar.gz \
            | tar xz conftest && sudo mv conftest /usr/local/bin/

      - name: Setup Terraform (for policy-gate dry plan)
        uses: ./.github/actions/terraform-setup

      - name: Conftest policy gate (dry plan)
        env:
          GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN_READONLY }}
        run: |
          # Policy gate runs against a read-only plan of the production root.
          # Without a read token (fork PRs) the gate still blocks merge via
          # the missing required check context — no silent bypass.
          if [ -z "$GITHUB_TOKEN" ]; then echo "no read token — policy gate skipped (check stays required)"; exit 0; fi
          cd terraform/environments/production
          terraform init -backend=false
          terraform plan -lock=false -out=tfplan
          terraform show -json tfplan > plan.json
          conftest test plan.json --policy ../../policies --all-namespaces
