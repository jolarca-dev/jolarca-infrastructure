---
# 95-monitoring.yml — Deploy Prometheus + Grafana + Alertmanager.
# Monitoring stack on the dedicated monitor host (CT-201, 10.10.1.6).
# Scrapes all services over the WireGuard mesh.

- name: Deploy monitoring stack
  hosts: monitor
  become: true
  gather_facts: true
  roles:
    - role: monitoring

  post_tasks:
    - name: Verify Prometheus is responding
      ansible.builtin.uri:
        url: "http://10.10.1.6:9090/-/healthy"
        status_code: [200]
      register: prometheus_health

    - name: Verify Grafana is responding
      ansible.builtin.uri:
        url: "http://10.10.1.6:3000/api/health"
        status_code: [200]
      register: grafana_health

    - name: Verify Alertmanager is responding
      ansible.builtin.uri:
        url: "http://10.10.1.6:9093/-/healthy"
        status_code: [200]
      register: alertmanager_health

    - name: Report monitoring status
      ansible.builtin.debug:
        msg: |
          Prometheus: {{ 'UP' if prometheus_health.status == 200 else 'DOWN' }}
          Grafana: {{ 'UP' if grafana_health.status == 200 else 'DOWN' }}
          Alertmanager: {{ 'UP' if alertmanager_health.status == 200 else 'DOWN' }}
          Dashboard: http://10.10.1.6:3000/d/jolarca-overview
