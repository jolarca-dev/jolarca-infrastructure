---
# Production inventory — fill in real IPs/hostnames when Proxmox hardware arrives.
# All hosts connect via WireGuard mesh (wg0, 10.10.0.0/16).
# SSH access is key-only through the bastion host.
#
# IP scheme mirrors staging (edge=.1, app=.2, db=.3, vault=.4, minio=.5,
# monitor=.6, backup=.7) for playbook consistency. Only the physical/LAN
# IPs differ (commented out until assigned).

all:
  vars:
    ansible_user: deploy
    ansible_become: true
    ansible_become_method: sudo
    wg_network: 10.10.0.0/16
    environment_name: production

children:
  edge:
    hosts:
      edge-production:
        # ansible_host: 10.10.1.1        # WireGuard IP — fill on deploy
        # ansible_ssh_host: <bastion-ip>  # SSH via bastion — fill on deploy
        wg_address: 10.10.1.1/24
        vm_id: 100
        node_type: vm

  app:
    hosts:
      app-production:
        # ansible_host: 10.10.1.2
        wg_address: 10.10.1.2/24
        vm_id: 101
        node_type: vm

  db:
    hosts:
      db-production:
        # ansible_host: 10.10.1.3
        wg_address: 10.10.1.3/24
        vm_id: 102
        node_type: vm
        pg_is_primary: true

  vault:
    hosts:
      vault-production:
        # ansible_host: 10.10.1.4
        wg_address: 10.10.1.4/24
        vm_id: 103
        node_type: vm

  minio:
    hosts:
      minio-production:
        # ansible_host: 10.10.1.5
        wg_address: 10.10.1.5/24
        vm_id: 200
        node_type: lxc

  monitor:
    hosts:
      monitor-production:
        # ansible_host: 10.10.1.6
        wg_address: 10.10.1.6/24
        vm_id: 201
        node_type: lxc

  backup:
    hosts:
      backup-production:
        # ansible_host: 10.10.1.7
        wg_address: 10.10.1.7/24
        vm_id: 202
        node_type: lxc
