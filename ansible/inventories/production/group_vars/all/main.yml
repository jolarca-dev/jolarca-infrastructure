---
# Production group_vars — production-specific overrides.
# Inherits from ansible/group_vars/all/main.yml (shared baseline).
# This file overrides only what differs from staging.

# ── Environment ────────────────────────────────────────────────────────
environment_name: production
ansible_user: deploy

# ── WireGuard mesh ─────────────────────────────────────────────────────
wg_subnet: "10.10.1.0/24"

# ── TLS ────────────────────────────────────────────────────────────────
# Production uses Let's Encrypt (dehydrated) for the edge,
# internal CA for service-to-service.
nginx_tls_cert: "/var/lib/dehydrated/certs/marketplace.jolarca.org/fullchain.pem"
nginx_tls_key: "/var/lib/dehydrated/certs/marketplace.jolarca.org/privkey.pem"
nginx_server_name: "marketplace.jolarca.org"
letsencrypt_domains: "marketplace.jolarca.org www.marketplace.jolarca.org"
letsencrypt_email: "ops@journeyoflife.org"

# ── Django ─────────────────────────────────────────────────────────────
django_allowed_hosts:
  - "marketplace.jolarca.org"
  - "www.marketplace.jolarca.org"
  - "localhost"
  - "127.0.0.1"

# ── Internal CA ────────────────────────────────────────────────────────
# Path to internal CA cert on the Ansible controller.
# Distributed to all hosts by the hardening role.
hardening_internal_ca_cert: "files/jolarca-internal-ca.pem"

# ── Backup ─────────────────────────────────────────────────────────────
borg_repo: "borg@offsite-eu:./jolarca-production"
offsite_sync_enabled: true

# ── Monitoring ─────────────────────────────────────────────────────────
# Prometheus scrapes all production hosts
prometheus_targets:
  - "10.10.1.1:9100"  # edge
  - "10.10.1.2:9100"  # app
  - "10.10.1.3:9100"  # db
  - "10.10.1.4:9100"  # vault
  - "10.10.1.5:9100"  # minio
  - "10.10.1.6:9100"  # monitor
  - "10.10.1.7:9100"  # backup
