---
# Staging inventory — fill in real IPs/hostnames when Proxmox arrives.
# All hosts connect via WireGuard mesh (wg0, 10.10.0.0/16).
# SSH access is key-only through the bastion host.

all:
  vars:
    ansible_user: deploy
    ansible_become: true
    ansible_become_method: sudo
    wg_network: 10.10.0.0/16
    environment_name: staging

children:
  edge:
    hosts:
      edge-staging:
        # ansible_host: 10.10.1.1        # WireGuard IP — fill on deploy
        # ansible_ssh_host: <bastion-ip>  # SSH via bastion — fill on deploy
        wg_address: 10.10.1.1/24
        vm_id: 100
        node_type: vm

  app:
    hosts:
      app-staging:
        # ansible_host: 10.10.1.2
        wg_address: 10.10.1.2/24
        vm_id: 101
        node_type: vm

  db:
    hosts:
      db-staging:
        # ansible_host: 10.10.1.3
        wg_address: 10.10.1.3/24
        vm_id: 102
        node_type: vm
        pg_is_primary: true

  vault:
    hosts:
      vault-staging:
        # ansible_host: 10.10.1.4
        wg_address: 10.10.1.4/24
        vm_id: 103
        node_type: vm

  minio:
    hosts:
      minio-staging:
        # ansible_host: 10.10.1.5
        wg_address: 10.10.1.5/24
        vm_id: 200
        node_type: lxc

  monitor:
    hosts:
      monitor-staging:
        # ansible_host: 10.10.1.6
        wg_address: 10.10.1.6/24
        vm_id: 201
        node_type: lxc

  backup:
    hosts:
      backup-staging:
        # ansible_host: 10.10.1.7
        wg_address: 10.10.1.7/24
        vm_id: 202
        node_type: lxc
