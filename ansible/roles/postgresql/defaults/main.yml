---
pg_version: '17'
pg_port: 5432
pg_data_dir: '/var/lib/postgresql/17/main'
pg_conf_dir: "/etc/postgresql/{{ pg_version }}/main"
pg_extensions: ['postgis', 'postgis-3', 'pgvector']
pg_max_connections: 100
pg_shared_buffers: '2GB'
pg_effective_cache_size: '6GB'
pg_work_mem: '64MB'
pg_ssl: true
pg_ssl_cert_file: "/etc/ssl/certs/ssl-cert-snakeoil.pem"
pg_ssl_key_file: "/etc/ssl/private/ssl-cert-snakeoil.key"
pg_listen_addresses: "'localhost,{{ wg_address | default('10.10.1.3') | regex_replace('/.*', '') }}'"
pg_is_primary: false
pg_databases: []
pg_users: []
pg_hba_entries:
  - { type: "local", database: "all", user: "postgres", address: "", method: "peer" }
  - { type: "hostssl", database: "all", user: "all", address: "{{ wg_subnet | default('10.10.1.0/24') }}", method: "scram-sha-256" }
