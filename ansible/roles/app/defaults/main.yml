---
# App role defaults — Django + Next.js marketplace deployment.

# ── Deployment mode (ADR-0007) ───────────────────────────────────────────
# compose-monolith: pilot mode — uses the app repo's docker-compose.prod.yml
#                   (all services on one VM: nginx, app, backend, worker,
#                   beat, postgres, redis, elasticsearch).
# compose-split:    target mode — uses infra-rendered separate compose files
#                   (docker-compose.backend.yml + docker-compose.frontend.yml)
#                   with external PostgreSQL, Redis, MinIO on dedicated VMs.
# Plain literal: defaults/main.yml is the lowest-precedence var source, so any
# group_vars/host_vars/extra-vars override already wins. Do NOT write this as
# "{{ app_deploy_mode | default(...) }}" — self-reference in the same file that
# defines it makes Ansible fail with "Recursive loop detected in template".
app_deploy_mode: compose-monolith

# ── Application ──────────────────────────────────────────────────────────
app_user: jol
app_group: jol
app_dir: /opt/jolarca
app_repo: "https://github.com/jolarca-dev/jolarca.git"
app_branch: main
app_env: staging

# ── Django backend ──────────────────────────────────────────────────────
django_port: 8000
django_workers: 3
django_timeout: 120
django_settings_module: "project.settings"
django_allowed_hosts:
  - "localhost"
  - "127.0.0.1"
  - "10.10.1.2"
  - "staging.journeyoflife.org"

# ── Next.js frontend ───────────────────────────────────────────────────
frontend_port: 3000

# ── Celery ──────────────────────────────────────────────────────────────
celery_worker_count: 2
celery_log_level: INFO

# ── Database ────────────────────────────────────────────────────────────
db_host: "10.10.1.3"
db_port: 5432
db_name: jol_marketplace
db_user: jol_app
# compose-monolith: PG runs inside compose stack → use Docker service name, no TLS.
# compose-split:    PG runs on dedicated DB VM → WireGuard IP, TLS verify-full.
db_sslmode: "{{ 'disable' if app_deploy_mode == 'compose-monolith' else 'verify-full' }}"

# ── Vault ───────────────────────────────────────────────────────────────
vault_addr: "https://10.10.1.4:8200"
vault_role: jol-app

# ── MinIO ───────────────────────────────────────────────────────────────
minio_endpoint: "http://10.10.1.5:9000"
minio_media_bucket: jol-marketplace-media
minio_uploads_bucket: jol-marketplace-uploads

# ── Docker ──────────────────────────────────────────────────────────────
app_use_docker: true
docker_compose_version: "2.32.4"
