---
# App role — deploy the Jolarca marketplace (Django backend + Next.js frontend).
# Supports two deployment modes per ADR-0007:
#   compose-monolith (pilot): app repo's docker-compose.prod.yml, all-in-one VM
#   compose-split (target): infra-rendered separate compose files, external DBs

# ── System setup ────────────────────────────────────────────────────────

- name: Create application group
  ansible.builtin.group:
    name: "{{ app_group }}"
    system: true
  tags: [app, user]

- name: Create application user
  ansible.builtin.user:
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ app_dir }}"
    create_home: false
  tags: [app, user]

- name: Create application directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0750"
  loop:
    - "{{ app_dir }}"
    - "{{ app_dir }}/app"
    - "{{ app_dir }}/config"
    - "{{ app_dir }}/logs"
    - "{{ app_dir }}/static"
    - "{{ app_dir }}/media"
  tags: [app, dirs]

# ── Docker installation ────────────────────────────────────────────────

- name: Install Docker prerequisites
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - python3-docker
    state: present
  when: app_use_docker
  tags: [app, docker]

- name: Add Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /usr/share/keyrings/docker-archive-keyring.asc
    mode: "0644"
  when: app_use_docker
  tags: [app, docker]

- name: Add Docker repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/usr/share/keyrings/docker-archive-keyring.asc]
      https://download.docker.com/linux/debian
      {{ ansible_distribution_release }} stable
    state: present
    filename: docker
  when: app_use_docker
  tags: [app, docker]

- name: Install Docker
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
  when: app_use_docker
  notify: Restart docker
  tags: [app, docker]

- name: Add app user to docker group
  ansible.builtin.user:
    name: "{{ app_user }}"
    groups: docker
    append: true
  when: app_use_docker
  tags: [app, docker]

- name: Enable and start Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
  when: app_use_docker
  tags: [app, docker]

# ── Application code ───────────────────────────────────────────────────

- name: Clone application repository
  ansible.builtin.git:
    repo: "{{ app_repo }}"
    dest: "{{ app_dir }}/app"
    version: "{{ app_branch }}"
    force: true
  become_user: "{{ app_user }}"
  notify: Restart app
  tags: [app, code]

# ── Environment configuration (from Vault, never committed to Git) ─────

- name: Deploy environment configuration
  ansible.builtin.template:
    src: app.env.j2
    dest: "{{ app_dir }}/config/app.env"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0640"
  notify: Restart app
  no_log: true
  tags: [app, config]

# Pilot mode: .env.prod is the compose env_file, rendered from Vault KV.
- name: Deploy .env.prod for compose-monolith mode
  ansible.builtin.copy:
    src: "{{ app_dir }}/config/app.env"
    dest: "{{ app_dir }}/app/.env.prod"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0640"
    remote_src: true
  when: app_deploy_mode == 'compose-monolith'
  notify: Restart app
  no_log: true
  tags: [app, config]

# ── Docker Compose deployment ──────────────────────────────────────────

# --- compose-split mode (target: separate infra-rendered compose files) ---

- name: Deploy Docker Compose file for backend
  ansible.builtin.template:
    src: docker-compose.backend.yml.j2
    dest: "{{ app_dir }}/docker-compose.backend.yml"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0640"
  when: app_use_docker and app_deploy_mode == 'compose-split'
  notify: Restart app
  tags: [app, docker]

- name: Deploy Docker Compose file for frontend
  ansible.builtin.template:
    src: docker-compose.frontend.yml.j2
    dest: "{{ app_dir }}/docker-compose.frontend.yml"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0640"
  when: app_use_docker and app_deploy_mode == 'compose-split'
  notify: Restart frontend
  tags: [app, docker]

# --- compose-monolith mode (pilot: app repo's docker-compose.prod.yml) ---

- name: Deploy compose-monolith stack
  ansible.builtin.command: >
    docker compose -f {{ app_dir }}/app/docker-compose.prod.yml
    --env-file {{ app_dir }}/app/.env.prod
    up -d --remove-orphans
  become_user: "{{ app_user }}"
  register: compose_up
  changed_when: "'Started' in compose_up.stderr or 'Created' in compose_up.stderr"
  when: app_use_docker and app_deploy_mode == 'compose-monolith'
  tags: [app, docker]

# ── Django migrations & static files ──────────────────────────────────

- name: Wait for database to be reachable (compose-split)
  ansible.builtin.wait_for:
    host: "{{ db_host }}"
    port: "{{ db_port }}"
    timeout: 30
  when: app_deploy_mode == 'compose-split'
  tags: [app, migrate]

- name: Wait for compose-internal database (compose-monolith)
  ansible.builtin.command: >
    docker compose -f {{ app_dir }}/app/docker-compose.prod.yml
    --env-file {{ app_dir }}/app/.env.prod
    exec -T postgres pg_isready -U {{ db_user }}
  become_user: "{{ app_user }}"
  register: pg_ready
  retries: 10
  delay: 5
  until: pg_ready.rc == 0
  changed_when: false
  when: app_use_docker and app_deploy_mode == 'compose-monolith'
  tags: [app, migrate]

- name: Run Django database migrations (compose-split)
  ansible.builtin.command: >
    docker compose -f {{ app_dir }}/docker-compose.backend.yml
    exec -T backend python manage.py migrate --noinput
  become_user: "{{ app_user }}"
  changed_when: true
  when: app_use_docker and app_deploy_mode == 'compose-split'
  tags: [app, migrate]

- name: Run Django database migrations (compose-monolith)
  ansible.builtin.command: >
    docker compose -f {{ app_dir }}/app/docker-compose.prod.yml
    --env-file {{ app_dir }}/app/.env.prod
    exec -T backend python manage.py migrate --noinput
  become_user: "{{ app_user }}"
  changed_when: true
  when: app_use_docker and app_deploy_mode == 'compose-monolith'
  tags: [app, migrate]

- name: Collect Django static files (compose-split)
  ansible.builtin.command: >
    docker compose -f {{ app_dir }}/docker-compose.backend.yml
    exec -T backend python manage.py collectstatic --noinput
  become_user: "{{ app_user }}"
  changed_when: true
  when: app_use_docker and app_deploy_mode == 'compose-split'
  tags: [app, static]

- name: Collect Django static files (compose-monolith)
  ansible.builtin.command: >
    docker compose -f {{ app_dir }}/app/docker-compose.prod.yml
    --env-file {{ app_dir }}/app/.env.prod
    exec -T backend python manage.py collectstatic --noinput
  become_user: "{{ app_user }}"
  changed_when: true
  when: app_use_docker and app_deploy_mode == 'compose-monolith'
  tags: [app, static]

# ── Systemd services (compose-split mode only) ────────────────────────
# In compose-monolith mode, Docker Compose handles restarts via
# restart: unless-stopped and no separate systemd units are needed.

- name: Deploy backend systemd service
  ansible.builtin.template:
    src: jol-backend.service.j2
    dest: /etc/systemd/system/jol-backend.service
    owner: root
    group: root
    mode: "0644"
  when: app_use_docker and app_deploy_mode == 'compose-split'
  notify:
    - Reload systemd
    - Restart app
  tags: [app, service]

- name: Deploy frontend systemd service
  ansible.builtin.template:
    src: jol-frontend.service.j2
    dest: /etc/systemd/system/jol-frontend.service
    owner: root
    group: root
    mode: "0644"
  when: app_use_docker and app_deploy_mode == 'compose-split'
  notify:
    - Reload systemd
    - Restart frontend
  tags: [app, service]

- name: Enable and start backend service
  ansible.builtin.systemd:
    name: jol-backend
    enabled: true
    state: started
    daemon_reload: true
  when: app_use_docker and app_deploy_mode == 'compose-split'
  tags: [app, service]

- name: Enable and start frontend service
  ansible.builtin.systemd:
    name: jol-frontend
    enabled: true
    state: started
    daemon_reload: true
  when: app_use_docker and app_deploy_mode == 'compose-split'
  tags: [app, service]

# ── Health verification ───────────────────────────────────────────────

- name: Verify app health (compose-monolith)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ django_port }}/api/v1/health/"
    status_code: [200]
  register: health_check
  retries: 5
  delay: 10
  until: health_check is not failed
  when: app_deploy_mode == 'compose-monolith'
  tags: [app, verify]

- name: Verify app health (compose-split)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ django_port }}/api/v1/health/"
    status_code: [200]
  register: health_check
  retries: 5
  delay: 10
  until: health_check is not failed
  when: app_deploy_mode == 'compose-split'
  tags: [app, verify]
