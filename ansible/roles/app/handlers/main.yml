---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart docker
  ansible.builtin.systemd:
    name: docker
    state: restarted

- name: Restart app
  ansible.builtin.systemd:
    name: jol-backend
    state: restarted

- name: Restart frontend
  ansible.builtin.systemd:
    name: jol-frontend
    state: restarted
