---
- name: Create MinIO system group
  ansible.builtin.group:
    name: "{{ minio_group }}"
    system: true
    state: present
  tags: [minio, user]

- name: Create MinIO system user
  ansible.builtin.user:
    name: "{{ minio_user }}"
    group: "{{ minio_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
  tags: [minio, user]

- name: Create MinIO data directory
  ansible.builtin.file:
    path: "{{ minio_data_dir }}"
    state: directory
    owner: "{{ minio_user }}"
    group: "{{ minio_group }}"
    mode: "0750"
  tags: [minio, config]

- name: Download MinIO server binary
  ansible.builtin.get_url:
    url: "https://dl.min.io/server/minio/release/linux-amd64/minio"
    dest: /usr/local/bin/minio
    mode: "0755"
    owner: root
    group: root
  tags: [minio, packages]

- name: Deploy MinIO environment file
  ansible.builtin.template:
    src: minio.env.j2
    dest: /etc/default/minio
    owner: root
    group: root
    mode: "0640"
  notify: Restart minio
  no_log: true
  tags: [minio, config]

- name: Deploy MinIO systemd service
  ansible.builtin.template:
    src: minio.service.j2
    dest: /etc/systemd/system/minio.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart minio
  tags: [minio, service]

- name: Enable and start MinIO
  ansible.builtin.systemd:
    name: minio
    enabled: true
    state: started
  tags: [minio, service]

- name: Wait for MinIO to be ready
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ minio_port }}/minio/health/live"
    status_code: [200]
  register: minio_health
  retries: 10
  delay: 3
  until: minio_health is not failed
  tags: [minio, verify]
