---
- name: Verify — wireguard role
  hosts: all
  become: true
  tasks:
    - name: Verify WireGuard is installed
      ansible.builtin.package:
        name: wireguard
        state: present
      check_mode: true
      register: wg_pkg
      failed_when: wg_pkg is changed

    - name: Verify IP forwarding is enabled
      ansible.builtin.command: sysctl net.ipv4.ip_forward
      register: ip_forward
      changed_when: false
      failed_when: ip_forward.stdout | trim != "net.ipv4.ip_forward = 1"

    - name: Verify the wg userspace tool is available
      ansible.builtin.command: wg --version
      register: wg_ver
      changed_when: false
      failed_when: wg_ver.rc != 0

    - name: Verify the persistent interface config directory exists
      ansible.builtin.stat:
        path: /etc/wireguard
      register: wg_dir
      failed_when: not wg_dir.stat.isdir
