# Pre-commit hooks — local gate before CI. Install once: pre-commit install
# Compliance: secret scanning (SOC 2 CC6.6), IaC hygiene (ISO 27001 A.8.25).
# Hook revisions are PINNED; bump via dependabot-style review, never ad hoc.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: 'kubernetes/(base|overlays)/.*'  # kustomize multi-doc later
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=512']

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks   # secrets must never reach git history

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.3
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args:
          - --hook-config=--parallelism-limit=4
      - id: terraform_tflint
      - id: terraform_checkov
        args:
          - --args=--quiet
          - --args=--compact

  - repo: https://github.com/ansible/ansible-lint
    rev: v24.10.0
    hooks:
      - id: ansible-lint
        # Workstream pending: hook stays defined so it activates the moment
        # ansible playbooks land. Fails only on ansible files.
        files: '^ansible/.*\.(yml|yaml)$'
